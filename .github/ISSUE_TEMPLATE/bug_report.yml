name: Bug report
description: Something doesn't work as expected
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Please search existing issues first.
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About
      placeholder: 1.0.12
    validations: { required: true }
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 7, Android 14
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. See error
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations: { required: true }
  - type: textarea
    id: details
    attributes:
      label: Technical details / logs
      description: For download failures, tap "Technical details" → "Copy details" in the error sheet and paste it here.
      render: text
