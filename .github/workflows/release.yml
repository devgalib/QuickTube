name: Release

# Pushing to `production` publishes a signed APK as a GitHub Release.
# Only the repository owner can push to `production` (enforced by a repository ruleset).
on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          base=$(grep -E '^appVersionBase=' gradle.properties | cut -d= -f2)
          code=${{ github.run_number }}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$base.$code" >> "$GITHUB_OUTPUT"
          echo "Releasing $base.$code (versionCode $code)"

      - name: Restore signing key and Firebase config
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON not set; building without Firebase"
          fi

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-parallel --stacktrace \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }}

      - name: Verify signature and collect the APK
        id: apk
        run: |
          src=$(ls app/build/outputs/apk/release/*.apk | head -1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$src" | grep -q "Signer #1" || { echo "::error::APK is not signed"; exit 1; }
          out="QuickTube-v${{ steps.version.outputs.name }}.apk"
          mkdir -p dist && cp "$src" "dist/$out"
          (cd dist && sha256sum "$out" > "$out.sha256")
          echo "file=dist/$out" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.name }}"
          prev=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
          args=(--target "${{ github.sha }}" --title "QuickTube $tag" --generate-notes)
          [ -n "$prev" ] && args+=(--notes-start-tag "$prev")
          gh release create "$tag" dist/* "${args[@]}"

      - name: Clean up secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" app/google-services.json
