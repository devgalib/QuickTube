name: Release

# Pushing to `production` publishes a signed APK as a GitHub Release.
# Only the repository owner can push to `production` (enforced by a repository ruleset).
on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          base=$(grep -E '^appVersionBase=' gradle.properties | cut -d= -f2)
          code=${{ github.run_number }}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$base.$code" >> "$GITHUB_OUTPUT"
          echo "Releasing $base.$code (versionCode $code)"

      - name: Restore signing key and Firebase config
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON not set; building without Firebase"
          fi

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-parallel --stacktrace \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }}

      - name: Verify signatures and collect the APKs
        env:
          EXPECTED_CERT_SHA256: b5fb3a7defdc7a3e0c0d6c3b468bc6353cd22225bbfee0585d7f337667aeb87a
        run: |
          dir=app/build/outputs/apk/release
          ls -la "$dir"
          # Newest build-tools that actually ships apksigner.
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -n "$apksigner" ] || { echo "::error::apksigner not found in $ANDROID_HOME/build-tools"; exit 1; }
          echo "Using $apksigner"
          mkdir -p dist
          # One APK per CPU type plus a universal one (same version code; the in-app updater picks by CPU).
          for abi in arm64-v8a armeabi-v7a universal; do
            src="$dir/app-$abi-release.apk"
            [ -f "$src" ] || { echo "::error::$src not found (an unsigned build would end in -unsigned.apk)"; exit 1; }
            if ! report=$("$apksigner" verify --verbose --print-certs "$src" 2>&1); then
              echo "$report"; echo "::error::$src signature verification failed"; exit 1
            fi
            # Output differs between build-tools versions ("Signer #1 certificate …" vs "V2 Signer: certificate …").
            digest=$(echo "$report" | grep -m1 -oE "certificate SHA-256 digest: [0-9a-f]{64}" | awk '{print $NF}')
            echo "$abi signed with certificate SHA-256: ${digest:-none}"
            # Fingerprint of the QuickTube release key (public; not a secret). Anything else is refused.
            if [ "$digest" != "$EXPECTED_CERT_SHA256" ]; then
              echo "$report"; echo "::error::$src is not signed with the QuickTube release key"; exit 1
            fi
            if [ "$abi" = universal ]; then out="QuickTube-v${{ steps.version.outputs.name }}.apk"
            else out="QuickTube-v${{ steps.version.outputs.name }}-$abi.apk"; fi
            cp "$src" "dist/$out"
            (cd dist && sha256sum "$out" > "$out.sha256")
          done
          ls -la dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.name }}"
          universal="dist/QuickTube-$tag.apk"
          prev=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
          args=(--target "${{ github.sha }}" --title "QuickTube $tag" --generate-notes)
          [ -n "$prev" ] && args+=(--notes-start-tag "$prev")
          # Built as a draft (invisible to apps), universal APK uploaded last, one file at a time: versions up to
          # 1.0.3 take the last .apk / .apk.sha256 asset. Published only once everything is there.
          gh release create "$tag" dist/*-arm64-v8a.apk* dist/*-armeabi-v7a.apk* --draft "${args[@]}"
          gh release upload "$tag" "$universal"
          gh release upload "$tag" "$universal.sha256"
          gh release edit "$tag" --draft=false --latest

      - name: Clean up secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" app/google-services.json
